# MatPhoto - Development (branch dev, image :nightly) with pgAdmin
#   docker compose -f docker-compose.dev.yml up -d
#   App:     http://localhost:4830
#   pgAdmin: http://localhost:4831   (no sign-in; database password: matphoto)
name: matphoto-dev

services:
  web:
    image: ghcr.io/real-ttx/matphoto:nightly
    restart: unless-stopped
    ports:
      - "4830:4830"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: matphoto
      POSTGRES_USER: matphoto
      POSTGRES_PASSWORD: matphoto
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matphoto -d matphoto"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "4831:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@matphoto.example.com
      PGADMIN_DEFAULT_PASSWORD: matphoto
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

configs:
  servers:
    content: |
      {"Servers": {"1": {"Name": "MatPhoto", "Group": "Servers", "Host": "db", "Port": 5432, "MaintenanceDB": "matphoto", "Username": "matphoto", "SSLMode": "prefer"}}}

volumes:
  web-data:
  db-data:
  pgadmin-data:
