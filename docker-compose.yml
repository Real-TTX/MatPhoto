# MatPhoto - Release (branch main, image :latest)
#   docker compose up -d        ->  http://localhost:4830
# The first account that registers is the administrator. Then Administration -> Storages: a share of the NAS (SMB, WebDAV, SFTP, FTP) or a folder of the server.
# A folder of the NAS as a local folder: mount it below /storage of web, e.g. under "volumes:" of web:  - /volume1/photo:/storage/photo
# No variable is needed: MatPhoto does its whole job without them. Mattiverse connects the rest by itself (see README); without it, these are optional
# under "environment:" of web:
#   MAT_PUBLIC_URL                public address (links in mails); fixed on Administration -> System while set
#   MAT_FRAME_ANCESTORS           origins that may show MatPhoto in a frame (Mattiverse)
#   MATIDENTITY_*, MATSMTP_*      sign-in through MatIdentity, mail through MatSMTP
name: matphoto

services:
  web:
    image: ghcr.io/real-ttx/matphoto:latest
    restart: unless-stopped
    ports:
      - "4830:4830"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: matphoto
      POSTGRES_USER: matphoto
      POSTGRES_PASSWORD: matphoto
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matphoto -d matphoto"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  web-data:
  db-data:
